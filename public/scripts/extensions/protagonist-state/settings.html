<div id="protagonist_state_settings">
    <div class="inline-drawer">
        <div class="inline-drawer-toggle inline-drawer-header">
            <div class="flex-container alignitemscenter margin0">
                <b>Protagonist State / 主角状态</b>
                <i id="protagonistStateOpenPanelButton" class="fa-solid fa-window-restore menu_button margin0" title="打开主角状态面板"></i>
            </div>
            <div class="inline-drawer-icon fa-solid fa-circle-chevron-down down"></div>
        </div>
        <div class="inline-drawer-content">
            <div class="protagonist_state_section">
                <label class="checkbox_label">
                    <input id="protagonist_state_enabled" type="checkbox" />
                    <span>启用状态注入 / Enable state injection</span>
                </label>

                <label class="checkbox_label">
                    <input id="protagonist_state_provide_to_memory" type="checkbox" />
                    <span>向 Memory 总结提供状态 / Provide state to Memory summary</span>
                </label>

                <div class="flex-container flexFlowRow alignItemsCenter gap10px">
                    <div id="protagonist_state_update_now" class="menu_button menu_button_icon" title="Use the Summarize extension's API configuration to update the latest assistant turn.">
                        <i class="fa-solid fa-arrows-rotate"></i>
                        <span>立即更新状态 / Update State Now</span>
                    </div>
                    <label for="protagonist_state_update_interval">
                        自动更新频率: <input id="protagonist_state_update_interval" class="text_pole widthUnset" type="number" min="0" max="100" step="1" />
                        <small>使用“总结”的 API 配置。0 = 仅手动；N = 每 N 个 AI 回复更新一次</small>
                    </label>
                </div>

                <div class="flex-container flexFlowRow alignItemsCenter gap10px">
                    <label for="protagonist_state_update_history_messages">
                        更新上下文消息数: <input id="protagonist_state_update_history_messages" class="text_pole widthUnset" type="number" min="0" max="9999" step="1" />
                        <small>0 = 从聊天开头发送；N = 最近 N 条用户/助手消息</small>
                    </label>
                    <label class="checkbox_label">
                        <input id="protagonist_state_include_memory_summary" type="checkbox" />
                        <span>发送 Memory Summary</span>
                    </label>
                </div>

                <label class="checkbox_label">
                    <input id="protagonist_state_show_bottom_bar" type="checkbox" />
                    <span>显示底部状态条 / Show bottom state bar</span>
                </label>

                <div class="flex-container flexFlowRow alignItemsCenter gap10px">
                    <div id="protagonist_state_open_popup" class="menu_button menu_button_icon" title="打开状态编辑弹窗">
                        <i class="fa-solid fa-table"></i>
                        <span>打开状态弹窗 / Open State Popup</span>
                    </div>
                </div>

                <div class="protagonist_state_injection_grid">
                    <label class="protagonist_state_injection_field" for="protagonist_state_position">
                        <span>注入位置 / Position</span>
                        <select id="protagonist_state_position" class="text_pole">
                            <option value="1">聊天内 @ 深度 / In-chat</option>
                            <option value="2">主提示词之前 / Before main prompt</option>
                            <option value="0">主提示词之后 / After main prompt</option>
                            <option value="-1">不注入 / None</option>
                        </select>
                    </label>
                    <label class="protagonist_state_injection_field" for="protagonist_state_depth">
                        <span>深度 / Depth</span>
                        <input id="protagonist_state_depth" class="text_pole" type="number" min="0" max="9999" />
                    </label>
                    <label class="protagonist_state_injection_field" for="protagonist_state_role">
                        <span>角色 / Role</span>
                        <select id="protagonist_state_role" class="text_pole">
                            <option value="0">System（系统）</option>
                            <option value="1">User（用户）</option>
                            <option value="2">Assistant（助手）</option>
                        </select>
                    </label>
                </div>
                <p class="protagonist_state_injection_help">DeepSeek 聊天末尾动态注入建议：聊天内 @ 深度 0 + Assistant。</p>

            </div>

            <hr>

            <div class="protagonist_state_section">
                <h4>数据表 / Tables</h4>
                <div id="protagonist_state_tables">
                    <div class="protagonist_state_table_row">
                        <label class="checkbox_label">
                            <input id="protagonist_state_table_global_state" data-table="global_state" type="checkbox" />
                            <span>全局状态（时间/地点）</span>
                        </label>
                    </div>
                    <div class="protagonist_state_table_row">
                        <label class="checkbox_label">
                            <input id="protagonist_state_table_protagonist_info" data-table="protagonist_info" type="checkbox" />
                            <span>主角信息（身份/外貌/性格）</span>
                        </label>
                    </div>
                    <div class="protagonist_state_table_row">
                        <label class="checkbox_label">
                            <input id="protagonist_state_table_important_characters" data-table="important_characters" type="checkbox" />
                            <span>重要角色</span>
                        </label>
                    </div>
                    <div class="protagonist_state_table_row">
                        <label class="checkbox_label">
                            <input id="protagonist_state_table_protagonist_skills" data-table="protagonist_skills" type="checkbox" />
                            <span>主角技能</span>
                        </label>
                    </div>
                    <div class="protagonist_state_table_row">
                        <label class="checkbox_label">
                            <input id="protagonist_state_table_inventory" data-table="inventory" type="checkbox" />
                            <span>背包物品</span>
                        </label>
                    </div>
                    <div class="protagonist_state_table_row">
                        <label class="checkbox_label">
                            <input id="protagonist_state_table_quests_events" data-table="quests_events" type="checkbox" />
                            <span>任务与事件</span>
                        </label>
                    </div>
                    <div class="protagonist_state_table_row">
                        <label class="checkbox_label">
                            <input id="protagonist_state_table_options" data-table="options" type="checkbox" />
                            <span>选项</span>
                        </label>
                    </div>
                </div>
            </div>

        </div>
    </div>
</div>
